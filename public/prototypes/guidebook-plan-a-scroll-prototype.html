<script>
setTimeout(() => {
  const stage = document.querySelector('.stage');
  const paper = document.getElementById('paper');
  const pageList = document.getElementById('pageList');
  const buttons = Array.from(pageList.children);
  const bar = document.createElement('div');
  bar.className = 'snapshot-bar';
  bar.innerHTML = '<div><strong>本次为一次性仿真的完整路书输出</strong><span>高德路线快照、天气、预算和 DeepSeek 文案已拼接为连续页面；滚轮即可查看全部。</span></div><div class="snapshot-tags"><em>高德路线 3 段</em><em>候选景点 5 个</em><em>天气 5 天</em><em>预算 ¥24,800</em></div>';
  stage.prepend(bar);
  const stream = document.createElement('div');
  stream.className = 'stream';
  stage.appendChild(stream);
  const clonedPages = [];
  buttons.forEach((button, index) => {
    button.click();
    const clone = document.createElement('article');
    clone.className = 'paper static-page';
    clone.id = 'continuous-page-' + (index + 1);
    clone.innerHTML = paper.innerHTML;
    stream.appendChild(clone);
    clonedPages.push(clone);
  });
  paper.style.display = 'none';
  buttons.forEach((button, index) => {
    const clean = button.cloneNode(true);
    clean.addEventListener('click', () => clonedPages[index].scrollIntoView({ behavior: 'smooth', block: 'start' }));
    button.replaceWith(clean);
  });

<script>
(async () => {
  try {
    const response = await fetch('/prototypes/plan-a-amap-snapshot.json', { cache: 'no-store' });
    const snapshot = await response.json();
    const allPois = [...snapshot.pois.shanghai, ...snapshot.pois.dali];
    const tags = document.querySelector('.snapshot-tags');
    if (tags) {
      tags.innerHTML = '<em>高德真实路线 ' + snapshot.legs.length + ' 段</em><em>真实 POI ' + allPois.length + ' 个</em><em>驾车备选 ' + snapshot.driveAlternative.distanceKm.toLocaleString('zh-CN') + ' km</em><em>真实快照 ' + new Date(snapshot.generatedAt).toLocaleString('zh-CN') + '</em>';
    }
    const routePage = document.getElementById('continuous-page-3');
    if (routePage) {
      const legNodes = routePage.querySelectorAll('.route-leg');
      snapshot.legs.forEach((leg, index) => {
        const node = legNodes[index];
        if (!node) return;
        const detail = '高德坐标 · ' + leg.distanceKm.toLocaleString('zh-CN') + ' km · 门到门约 ' + Math.round(leg.doorToDoorMinutes / 6) / 10 + ' 小时 · ' + leg.mode;
        node.querySelector('small').textContent = detail;
        node.querySelector('.price').textContent = '¥' + (leg.minimumPerPersonCost * 3).toLocaleString('zh-CN');
      });
      const notice = routePage.querySelector('.notice p');
      if (notice) notice.innerHTML = '真实高德快照：北京→上海 ' + snapshot.legs[0].distanceKm + ' km；上海→大理洱海航班直线 ' + snapshot.legs[1].distanceKm + ' km；备选自驾 ' + snapshot.driveAlternative.distanceKm.toLocaleString('zh-CN') + ' km、驾驶 ' + Math.round(snapshot.driveAlternative.drivingMinutes / 6) / 10 + ' 小时，含休息后门到门约 ' + Math.round(snapshot.driveAlternative.doorToDoorMinutes / 6) / 10 + ' 小时。';
      const card = routePage.querySelector('.card');
      if (card && !routePage.querySelector('.amap-real')) {
        card.insertAdjacentHTML('afterend', '<figure class="amap-real"><img src="' + snapshot.map + '" alt="高德真实路线快照" /><figcaption>高德静态地图快照 · ' + new Date(snapshot.generatedAt).toLocaleString('zh-CN') + '</figcaption></figure>');
      }
    }
    const overview = document.getElementById('continuous-page-2');
    if (overview) {
      const notice = overview.querySelector('.notice p');
      if (notice) notice.innerHTML = '真实高德候选已载入：' + snapshot.pois.shanghai.map((poi) => poi.name).join('、') + '；' + snapshot.pois.dali.map((poi) => poi.name).join('、') + '。<span class="real-poi">来源：' + snapshot.source + '</span>';
    }
  } catch (error) {
    const bar = document.querySelector('.snapshot-bar');
    if (bar) bar.innerHTML = '<div><strong>真实高德快照加载失败</strong><span>' + String(error) + '</span></div>';
  }
})();
</script>

    if (!coverMap.querySelector('.cover-amap-legend')) coverMap.insertAdjacentHTML('beforeend', '<span class="cover-amap-legend">高德地图 · A 北京 → B 上海 → C 大理洱海</span>');
  }
  const ids = ['continuous-page-5','continuous-page-7','continuous-page-9','continuous-page-11','continuous-page-13'];
  ids.forEach((id, index) => {
    const map = document.querySelector('#' + id + ' .map');
    const src = snapshot.dayMaps && snapshot.dayMaps['day' + (index + 1)];
    if (!map || !src) return;
    map.style.backgroundImage = 'url("' + src + '")';
    map.classList.add('has-real-map');
    if (!map.querySelector('.real-map-badge')) map.insertAdjacentHTML('beforeend', '<span class="real-map-badge">高德地图</span>');
  });
}, 350);
</script>
